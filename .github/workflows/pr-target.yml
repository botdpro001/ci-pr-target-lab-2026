name: manifest-only-proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "base_repo=${{ github.repository }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "pr_author=${{ github.event.pull_request.user.login }}"
          echo "association=${{ github.event.pull_request.author_association }}"
          echo "secret_set=${{ secrets.FAKE_CI_SECRET != '' }}"

      - name: Checkout trusted base
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Fetch only the attacker manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const res = await github.rest.repos.getContent({
              owner: context.payload.pull_request.head.repo.owner.login,
              repo: context.payload.pull_request.head.repo.name,
              path: 'manifest.yml',
              ref: context.payload.pull_request.head.sha
            });
            fs.writeFileSync('manifest.yml', Buffer.from(res.data.content, 'base64'));

      - name: Install Forge CLI in trusted tree
        run: npm install --prefix . --no-save --ignore-scripts --legacy-peer-deps @forge/cli@15.1.0

      - name: Create fake CI secret JSON outside the project
        env:
          FAKE_CI_SECRET: ${{ secrets.FAKE_CI_SECRET }}
        run: |
          mkdir -p "$HOME/.docker"
          node -e "require('fs').writeFileSync(process.env.HOME + '/.docker/config.json', JSON.stringify({auths:{'registry.example.invalid':{auth: process.env.FAKE_CI_SECRET || 'FAKE_SECRET_NOT_SET'}}, test_marker:'MANIFEST_ONLY_LAB'}))"
          test -s "$HOME/.docker/config.json"
          node -e "const p=require('path').resolve(process.env.GITHUB_WORKSPACE + '/../../../.docker/config.json'); const e=process.env.HOME + '/.docker/config.json'; console.log('resolved=' + p); console.log('expected=' + e); if (p !== e) process.exit(1);"

      - name: Run trusted build with attacker manifest
        env:
          FAKE_CI_SECRET: ${{ secrets.FAKE_CI_SECRET }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REQUIRE_SECRET: '1'
        run: node ci-harness.js "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/proof"

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-only-proof
          path: ${{ github.workspace }}/proof
